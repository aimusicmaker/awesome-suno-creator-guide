name: Report an error or broken source
description: Help correct a claim, translation, link or display problem.
title: "[Correction] "
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Paste the repository page URL and identify the affected section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs correcting?
      description: Quote the affected text or describe the broken link or display problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting source and suggested correction
      description: Include the original source, date checked, and any relevant model or account conditions.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Language, device or browser
      description: For translation and display reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed passwords, account identifiers, receipts and private recordings.
          required: true
